<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - AI Fitness Plan Generator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
            min-height: 100vh;
        }

        header {
            background: #1f7a5a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 20px;
            color: #1f7a5a;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #1f7a5a;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #155f45;
        }

        .result {
            white-space: pre-wrap;
            line-height: 1.7;
            background: #f7faf9;
            padding: 20px;
            border-radius: 10px;
            border-left: 5px solid #1f7a5a;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>FitBuddy</h1>
    <p>AI Fitness Plan Generator powered by Gemini</p>
</header>

<div class="container">

    <div class="card">

        <h2>Create Your Fitness Plan</h2>

        <form action="/generate" method="post">

            <div class="form-group">
                <label>Age</label>
                <input
                    type="number"
                    name="age"
                    min="10"
                    max="100"
                    required
                    placeholder="Example: 21"
                >
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fitness Goal</label>
                <select name="goal" required>
                    <option value="">Select Goal</option>
                    <option value="weight loss">Weight Loss</option>
                    <option value="muscle gain">Muscle Gain</option>
                    <option value="general wellness">General Wellness</option>
                    <option value="improve endurance">Improve Endurance</option>
                    <option value="increase strength">Increase Strength</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fitness Level</label>
                <select name="fitness_level" required>
                    <option value="">Select Fitness Level</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>

            <div class="form-group">
                <label>Available Equipment</label>
                <select name="equipment" required>
                    <option value="">Select Equipment</option>
                    <option value="no equipment">No Equipment</option>
                    <option value="home equipment">Home Equipment</option>
                    <option value="dumbbells">Dumbbells</option>
                    <option value="full gym">Full Gym</option>
                </select>
            </div>

            <div class="form-group">
                <label>Workout Duration</label>
                <select name="duration" required>
                    <option value="">Select Duration</option>
                    <option value="20 minutes">20 Minutes</option>
                    <option value="30 minutes">30 Minutes</option>
                    <option value="45 minutes">45 Minutes</option>
                    <option value="60 minutes">60 Minutes</option>
                </select>
            </div>

            <button type="submit">
                Generate AI Fitness Plan
            </button>

        </form>

    </div>

    {% if plan %}

    <div class="card">

        <h2>Your Personalized Fitness Plan</h2>

        <div class="result">
{{ plan }}
        </div>

    </div>

    {% endif %}

</div>

<footer>
    FitBuddy • AI Fitness Plan Generator
</footer>

</body>
</html>
